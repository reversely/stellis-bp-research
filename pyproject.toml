[project]
name = "stellis-bp-research"
version = "0.1.0"
description = "Camera blood pressure estimation research for Stellis"
readme = "README.md"
authors = [
    { name = "SL", email = "105625351+reversely@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.16.0",
    "huggingface-hub>=2.3.0",
    "mediapipe>=1.1.1",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "tabulate>=0.10.0",
    "torch>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
